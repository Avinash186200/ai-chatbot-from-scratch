name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server, model packages, evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            packages/*/pyproject.toml
      - name: Install server, extras and model packages
        run: |
          pip install -e "server[dev,mcp,graph,otel,pdf]"
          pip install -e packages/aa-model-ar1 -e packages/aa-model-regime
      - name: Lint
        run: ruff check server packages evals scripts
      - name: Vendor-import check (no LLM SDK outside the adapter)
        run: python scripts/check_vendor_imports.py
      - name: Server tests
        working-directory: server
        run: pytest -q
      - name: Model package tests
        run: |
          pytest -q packages/aa-model-ar1
          pytest -q packages/aa-model-regime
      - name: Eval harness tests
        run: pytest -q evals
      - name: Evals (questions, router, retrieval)
        run: python evals/run_evals.py
      - name: Evals (questions through the LangGraph agent)
        run: python evals/run_evals.py --suite questions --agent graph

  excel-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excel-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: excel-client/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run typecheck
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with the example settings
        run: |
          cp .env.example .env
          docker compose config --quiet
