[project]
name = "aa-model-ar1"
version = "1.1.0"
description = "Placeholder AR(1) forecaster served as an analytics-assistant model plugin."
license = { text = "MIT" }
requires-python = ">=3.11"
# The plugin API lives in the server package; the model has no other dependency.
dependencies = ["analytics-assistant>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# The server discovers models through this entry-point group.
[project.entry-points."analytics_assistant.models"]
ar1 = "aa_model_ar1:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_model_ar1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
