[project]
name = "aa-model-regime"
version = "0.4.0"
description = "Placeholder rate-regime rule served as an analytics-assistant model plugin."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["analytics-assistant>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."analytics_assistant.models"]
regime = "aa_model_regime:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_model_regime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
